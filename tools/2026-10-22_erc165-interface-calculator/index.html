<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERC-165 Interface ID Calculator & Inspector</title>
<style>
  :root {
    --bg: #0b1211;
    --card: #111c1a;
    --card-hover: #162522;
    --card-border: #1d332f;
    --accent: #14B8A6;
    --accent-glow: rgba(20, 184, 166, 0.2);
    --accent-dim: #0d766a;
    --text-primary: #e6f1ef;
    --text-muted: #829a95;
    --text-dim: #516864;
    --danger: #f43f5e;
    --warning: #f59e0b;
    --code-bg: #070c0b;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding: 1.5rem 1rem;
    min-height: 100vh;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 1.25rem;
  }

  .header-tag {
    display: inline-block;
    background: rgba(20, 184, 166, 0.12);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    margin-bottom: 0.5rem;
    border: 1px solid rgba(20, 184, 166, 0.3);
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
    margin-bottom: 0.35rem;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.925rem;
  }

  /* Preset Pills */
  .presets-wrap {
    margin-bottom: 1.5rem;
  }

  .section-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .preset-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .btn-pill {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text-muted);
    padding: 0.35rem 0.8rem;
    border-radius: 9999px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-pill:hover {
    border-color: var(--accent);
    color: var(--text-primary);
    background: var(--card-hover);
  }

  .btn-pill.active {
    background: rgba(20, 184, 166, 0.15);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* Main Grid */
  .grid-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }

  @media (min-width: 900px) {
    .grid-layout {
      grid-template-columns: 1.15fr 0.85fr;
    }
  }

  /* Cards */
  .card {
    background-color: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }

  .card:last-child {
    margin-bottom: 0;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: 0.85rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Main Result Card */
  .result-banner {
    background: linear-gradient(135deg, rgba(20, 184, 166, 0.1) 0%, rgba(17, 28, 26, 0.95) 100%);
    border: 1px solid var(--accent-dim);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 4px 20px -2px var(--accent-glow);
  }

  .result-meta {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .result-title {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
  }

  .result-value-wrap {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
  }

  .result-hex {
    font-family: var(--font-mono);
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.02em;
    word-break: break-all;
  }

  .result-bin {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  /* Form Elements */
  input[type="text"], textarea {
    width: 100%;
    background-color: var(--code-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    padding: 0.65rem 0.8rem;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(20, 184, 166, 0.2);
  }

  .input-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .btn {
    background: var(--accent);
    color: #051614;
    font-weight: 600;
    font-size: 0.85rem;
    border: none;
    border-radius: 6px;
    padding: 0.65rem 1rem;
