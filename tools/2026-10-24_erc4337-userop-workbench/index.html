<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERC-4337 UserOperation Lab</title>
  <style>
    :root {
      --bg: #0b1211;
      --card: #111c1a;
      --card-border: #1a2c29;
      --accent: #14B8A6;
      --accent-hover: #0d9488;
      --accent-dim: rgba(20, 184, 166, 0.15);
      --text: #e2e8f0;
      --text-muted: #8b9bb4;
      --text-sub: #5eead4;
      --danger: #f43f5e;
      --code-bg: #080d0c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px 16px;
      line-height: 1.5;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: bold;
      font-size: 18px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version-tag {
      font-size: 11px;
      background: var(--accent-dim);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(20, 184, 166, 0.3);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: #fff;
    }

    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b1211;
    }

    .btn-accent:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #fff;
    }

    .btn-group {
      display: flex;
      background: #070d0c;
      padding: 2px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    .btn-group .btn-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-group .btn-tab.active {
      background: var(--accent);
      color: #0b1211;
    }

    .select-sm {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    .select-sm:focus {
      border-color: var(--accent);
    }

    /* Layout Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 10px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 500px) {
      .field-row {
        grid-template-columns: 1fr;
      }
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label .hint {
      font-size: 11px;
      color: var(--text-sub);
      font-family: monospace;
    }

    input[type="text"], textarea {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      outline: none;
      transition: border-color 0.15s ease;
    }

    textarea {
      resize: vertical;
      min-height: 52px;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
    }

    .packed-badge {
      background: rgba(20, 184, 166, 0.1);
      border: 1px solid rgba(20, 184, 166, 0.3);
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .packed-badge .packed-title {
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .packed-badge .hex-view {
      font-family: monospace;
      word-break: break-all;
      background: #050a09;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #132420;
    }

    .packed-split {
      display: flex;
      gap: 8px;
      font-size: 11px;
    }

    .packed-split span {
      background: rgba(255,255,255,0.04);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.08);
      font-family: monospace;
    }

    /* Stats Banner */
    .stat-banner {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    @media (max-width: 600px) {
      .stat-banner {
        grid-template-columns: 1fr;
      }
    }

    .stat-box {
      background: #080f0e;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Hash Card */
    .hash-box {
      background: #060b0a;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 14px;
      position: relative;
    }

    .hash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .hash-val {
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
      color: #fff;
      user-select: all;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .copy-btn:hover {
      background: var(--accent-dim);
    }

    /* JSON code block */
    .code-container {
      position: relative;
    }

    pre code {
      display: block;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #cbd5e1;
      max-height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .code-copy {
      position: absolute;
      top: 8px;
      right: 8px;
    }

    /* Modal / Drawer for JSON import */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
