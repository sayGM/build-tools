<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVM Merkle Proof Lab</title>
<style>
  :root {
    --bg: #0b1211;
    --card: #111c1a;
    --card-hover: #162422;
    --card-border: #1a2c28;
    --accent: #14B8A6;
    --accent-hover: #0d9488;
    --accent-dim: rgba(20, 184, 166, 0.12);
    --accent-border: rgba(20, 184, 166, 0.35);
    --text: #f0fdfa;
    --text-muted: #94a3b8;
    --text-teal: #99f6e4;
    --danger: #f87171;
    --danger-dim: rgba(248, 113, 113, 0.12);
    --success: #34d399;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding: 16px;
    min-height: 100vh;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--card-border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand svg {
    width: 28px;
    height: 28px;
    fill: var(--accent);
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .tag {
    font-size: 0.72rem;
    background: var(--accent-dim);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 9999px;
    border: 1px solid var(--accent-border);
    font-family: var(--mono);
    text-transform: uppercase;
  }
  .layout-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }
  @media (min-width: 900px) {
    .layout-grid {
      grid-template-columns: 1.05fr 0.95fr;
    }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-teal);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  label {
    font-size: 0.78rem;
    color: var(--text-muted);
    display: block;
    margin-bottom: 4px;
    font-weight: 500;
  }
  select, textarea, input {
    background: #080e0d;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 0.82rem;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  select:focus, textarea:focus, input:focus {
    border-color: var(--accent);
  }
  textarea {
    resize: vertical;
    min-height: 160px;
    line-height: 1.4;
  }
  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  button {
    background: var(--card-border);
    color: var(--text);
    border: 1px solid transparent;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  button:hover {
    background: var(--card-hover);
    border-color: var(--accent-border);
  }
  button.primary {
    background: var(--accent);
    color: #042f2e;
    font-weight: 600;
  }
  button.primary:hover {
    background: var(--accent-hover);
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat-box {
    background: #080e0d;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .stat-val {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
    font-family: var(--mono);
  }
  .hash-display {
    background: #080e0d;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .hash-val {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--accent);
    word-break: break-all;
  }
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 8px;
    overflow-x: auto;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 0.82rem;
    padding: 6px 12px;
    border-radius: 6px;
  }
  .tab-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid var(--accent-border);
  }
  .tab-pane {
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .tab-pane.active {
    display: flex;
  }
  .leaf-list {
    max-height: 250px;
    overflow-y: auto;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    background: #080e0d;
  }
  .leaf-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid #13201d;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 0.78rem;
    gap: 8px;
    transition: background 0.1s;
  }
  .leaf-item:hover {
    background: var(--card-hover);
  }
  .leaf-item.selected {
    background: var(--accent-dim);
    border-left: 3px solid var(--accent);
  }
  .code-box {
    background: #080e0d;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre;
    color: #cbd5e1;
    position: relative;
    max-height: 260px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 6px;
    font-size: 0.7rem;
    border-radius: 4px;
    font-family: var(--mono);
  }
  .badge-valid { background: rgba(52, 211, 153, 0.15); color: var(--success); }
  .badge-invalid { background: var(--danger-dim); color: var(--danger); }
  .proof-steps {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.75rem;
    font-family: var(--mono);
    max-height: 180px;
    overflow-y: auto;
  }
  .proof-step-item {
    background: #080e0d;
    padding: 6px 10px;
    border-radius: 4px;
    border: 1px solid var(--card-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .footer-note {
    font-size: 0.73rem;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    padding-top: 8px;
  }
  .copy-toast {
    color: var(--accent);
    font-size: 0.72rem;
    transition: opacity 0.2s;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L4 7v10l8 5 8-5V7l-8-5zm0 2.2L18 8l-6 3.8L6 8l6-3.8zM5.5 8.9L11 12.4v7.7l-5.5-3.5V8.9zm13 7.7L13 20.1v-7.7l5.5-3.5v7.7z"/></svg>
      <div>
        <h1>EVM Merkle Proof Lab</h1>
        <div style="font-size: 0.75rem; color: var(--text-muted);">Standard OpenZeppelin-compatible Merkle tree builder & proof inspector</div>
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <span class="tag">Keccak-256</span>
      <span class="tag">OZ Sorted Pairs</span>
    </div>
  </header>

  <div class="layout-grid">
    <!-- Left Column: Inputs & Settings -->
    <div class="card">
      <div class="card-title">
        <span>Leaf Data Inputs</span>
        <div class="btn-group">
          <button id="presetAirdropBtn">Airdrop Preset</button>
          <button id="presetWhitelistBtn">Whitelist Preset</button>
        </div>
      </div>

      <div class="controls-row">
        <div style="flex: 1; min-width: 140px;">
          <label>Leaf Schema Format</label>
          <select id="schemaSelect">
            <option value="double-token">Address & Amount (OZ v5 Double-Hash)</option>
            <option value="single-addr">Address Only (OZ Single/Double)</option>
            <option value="raw-hex">Raw Bytes32 Hex per line</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 140px;">
          <label>Pair Sorting Strategy</label>
          <select id="sortPairsSelect">
            <option value="sorted">Sorted Pairs (OZ MerkleProof standard)</option>
            <option value="natural">Fixed Left/Right (Legacy / Unsorted)</option>
          </select>
        </div>
      </div>

      <div>
        <label id="inputLabel">Leaves (one entry per line: 0xAddress, TokenAmount)</label>
        <textarea id="leafInput" spellcheck="false" placeholder="0x70997970C51812dc3A010C7d01b50e0d17dc79C8, 1000000000000000000&#10;0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC, 2500000000000000000"></textarea>
      </div>

      <div class="controls-row" style="justify-content: space-between;">
        <span id="inputStatus" class="badge badge-valid">Ready</span>
        <button id="buildTreeBtn" class="primary">Recompute Tree</button>
      </div>

      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-label">Total Leaves</div>
          <div class="stat-val" id="leafCount">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Tree Depth</div>
          <div class="stat-val" id="treeDepth">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Total Nodes</div>
          <div class="stat-val" id="nodeCount">0</div>
        </div>
      </div>
    </div>

    <!-- Right Column: Computed Merkle Root & Leaf Explorer -->
    <div class="card">
      <div class="card-title">
        <span>Merkle Root</span>
        <span id="copyRootMsg" class="copy-toast"></span>
      </div>
      <div class="hash-display">
        <span class="hash-val" id="rootDisplay">0x0000...0000</span>
        <button id="copyRootBtn" title="Copy Root Hex">Copy</button>
      </div>

      <div class="card-title" style="margin-top: 6px;">
        <span>Select Leaf to Inspect Proof</span>
        <span id="copyProofMsg" class="copy-toast"></span>
      </div>

      <div class="leaf-list" id="leafListEl">
        <!-- Rendered items -->
      </div>

      <div id="inspectorDetails" style="display: flex; flex-direction: column; gap: 8px;">
        <label>Selected Leaf Keccak-256 Hash</label>
        <div class="hash-display">
          <span class="hash-val" id="selectedLeafHash">Select a leaf above</span>
          <button id="copyLeafHashBtn">Copy</button>
        </div>

        <label>Merkle Proof (<code style="color:var(--accent);">bytes32[]</code>)</label>
        <div class="proof-steps" id="proofStepsContainer">
          <div style="color: var(--text-muted); padding: 8px;">No leaf selected.</div>
        </div>

        <div class="btn-group" style="margin-top: 4px;">
          <button id="copySolProofBtn">Copy Solidity Array</button>
          <button id="copyJsonProofBtn">Copy JSON Proof</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Workspace: Verification & Export Code -->
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active
