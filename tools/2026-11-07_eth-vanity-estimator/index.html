<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETH Vanity Address Architect & Estimator</title>
  <style>
    :root {
      --bg: #0b1211;
      --card-bg: #111c1a;
      --card-border: #1b2e2a;
      --accent: #14B8A6;
      --accent-glow: rgba(20, 184, 166, 0.2);
      --accent-hover: #0d9488;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --code-bg: #070c0b;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 1.25rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1024px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1.25rem;
    }

    .badge-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.725rem;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(20, 184, 166, 0.12);
      color: var(--accent);
      border: 1px solid rgba(20, 184, 166, 0.3);
    }

    .badge.secondary {
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-muted);
      border-color: rgba(148, 163, 184, 0.2);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.925rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-title .icon {
      color: var(--accent);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"], input[type="number"], select {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      padding: 0.6rem 0.8rem;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .prefix-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .prefix-addon {
      position: absolute;
      left: 0.75rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      pointer-events: none;
      user-select: none;
    }

    .prefix-input-wrap input {
      padding-left: 2.2rem;
    }

    .pattern-preview {
      background: var(--code-bg);
      border: 1px dashed var(--card-border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      word-break: break-all;
      color: var(--text-muted);
    }

    .pattern-preview span.highlight {
      color: var(--accent);
      font-weight: bold;
      text-decoration: underline;
    }

    .toggle-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .toggle-btn {
      flex: 1;
      padding: 0.45rem 0.6rem;
      border-radius: 0.4rem;
      border: 1px solid var(--card-border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      text-align: center;
      transition: all 0.15s ease;
    }

    .toggle-btn.active {
      background: rgba(20, 184, 166, 0.15);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* Metric stat box */
