<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eth Hex & Selector Lab</title>
    <style>
        :root {
            --bg: #0b1211;
            --card: #111c1a;
            --accent: #14B8A6;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --border: #2d3a38;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-size: 1.5rem;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            background: #070b0a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            padding: 12px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 80px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .options {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 640px) {
            .grid { grid-template-columns: 1fr 1fr; }
            .full-width { grid-column: span 2; }
        }

        .result-item {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--border);
        }

        .result-item.highlight {
            border-left-color: var(--accent);
        }

        .result-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .result-value {
            font-family: monospace;
            word-break: break-all;
            font-size: 0.9rem;
            color: var(--text);
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.7rem;
            text-decoration: underline;
        }

        .copy-btn:hover { opacity: 0.8; }

        .tag {
            display: inline-block;
            padding: 2px 6px;
            background: var(--accent);
            color: var(--bg);
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Eth Hex Lab</h1>
            <p class="subtitle">Keccak-256 hashing, Method Selectors, and Hex padding utility</p>
        </header>

        <div class="card">
            <div class="input-group">
                <label for="mainInput">Input String or Hex</label>
                <textarea id="mainInput" placeholder="e.g. transfer(address,uint256) or 0x1234..."></textarea>
                <div class="options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="isHex"> Treat as Hex
                    </label>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="result-item highlight full-width">
                <div class="result-label">
                    <span>Keccak-256 Hash</span>
                    <button class="copy-btn" onclick="copy('resHash')">Copy</button>
                </div>
                <div id="resHash" class="result-value">0x...</div>
            </div>

            <div class="result-item">
                <div class="result-label">
                    <span>Function Selector (4 bytes)</span>
                    <button class="copy-btn" onclick="copy('resSelector')">Copy</button>
                </div>
                <div id="resSelector" class="result-value">-</div>
            </div>

            <div class="result-item">
                <div class="result-label">
                    <span>EIP-55 Checksum Address</span>
                    <button class="copy-btn" onclick="copy('resChecksum')">Copy</button>
                </div>
                <div id="resChecksum" class="result-value">-</div>
            </div>

            <div class="result-item">
                <div class="result-label">
                    <span>Padded Left (32 bytes)</span>
                    <button class="copy-btn" onclick="copy('resPadLeft')">Copy</button>
                </div>
                <div id="resPadLeft" class="result-value">-</div>
            </div>

            <div class="result-item">
                <div class="result-label">
                    <span>Padded Right (32 bytes)</span>
                </div>
                <div id="resPadRight" class="result-value">-</div>
            </div>

            <div class="result-item">
                <div class="result-label">
                    <span>Decimal (from Hex)</span>
                </div>
                <div id="resDec" class="result-value">-</div>
            </div>

            <div class="result-item">
                <div class="result-label">
                    <span>Length</span>
                </div>
                <div id="resLen" class="result-value">-</div>
            </div>
        </div>
    </div>

    <script>
        /** 
         * Compact Keccak-256 Implementation 
         * Derived from tiny-js implementations
         */
        const Keccak256 = (function() {
            const RC = new Uint32Array([
                1, 0, 32898, 0, 32906, 2147483648, 2147516514, 2147483648, 32907, 0, 2147483649, 0, 
                2147516545, 2147483648, 32777, 2147483648, 138, 0, 136, 0, 2147516425, 0, 2147483658, 0, 
                2147516555, 0, 2147483659, 2147483648, 32905, 2147483648, 32771, 2147483648, 32770, 2147483648, 
                128, 2147483648, 32778, 0, 2147483658, 2147483648, 2147516545, 2147483648, 32896, 2147483648, 
                129, 0, 2147516425, 2147483648
            ]);
            const RHO = new Uint32Array([0, 1, 62, 28, 27, 36, 44, 6, 55, 20, 3, 10, 43, 25, 39, 41, 45, 15, 21, 8, 18, 2, 61, 56, 14]);
            const PI = new Uint32Array([0, 10, 7, 11, 17, 18, 3, 5, 16, 8, 21, 24, 4, 15, 23, 19, 13, 12, 2, 20, 14, 22, 9, 6, 1]);

            function keccak(buffer) {
                const s = new Uint32Array(50);
                let b = new Uint8Array(buffer);
                const blockByteLen = 136;
                let offset = 0;

                while (offset < b.length) {
                    const blockLen = Math.min(b.length - offset, blockByteLen);
                    for (let i = 0; i < blockLen; i++) {
                        s[i >> 2] ^= b[offset + i] << (8 * (i % 4));
                    }
                    if (blockLen === blockByteLen) {
                        permute(s);
                        offset += blockByteLen;
                    } else break;
                }

                // Padding
                let lastBlock = new Uint8Array(blockByteLen);
                lastBlock.set(b.subarray(offset));
                lastBlock[b.length - offset] ^= 0x01; // Ethereum padding
                lastBlock[blockByteLen - 1] ^= 0x80;
                for (let i = 0; i < blockByteLen; i++) {
                    s[i >> 2] ^= lastBlock[i] << (8 * (i % 4));
                }
                permute(s);

                const out = new Uint8Array(32);
                for (let i = 0; i < 32; i++) {
                    out[i] = (s[i >> 2] >> (8 * (i % 4))) & 0xFF;
                }
                return out;
            }

            function permute(s) {
                for (let round = 0; round < 24; round++) {
                    let bc = new Uint32Array(10);
                    for (let i = 0; i < 5; i++) {
                        bc[i * 2] = s[i * 2] ^ s[i * 2 + 10] ^ s[i * 2 + 20] ^ s[i * 2 + 30] ^ s[i * 2 + 40];
                        bc[i * 2 + 1] = s[i * 2 + 1] ^ s[i * 2 + 11] ^ s[i * 2 + 21] ^ s[i * 2 + 31] ^ s[i * 2 + 41];
                    }
                    for (let i = 0; i < 5; i++) {
                        let t0 = bc[(i + 4) % 5 * 2] ^ (bc[(i + 1) % 5 * 2] << 1 | bc[(i + 1) % 5 * 2 + 1] >>> 31);
                        let t1 = bc[(i + 4) % 5 * 2 + 1] ^ (bc[(i + 1) % 5 * 2 + 1] << 1 | bc[(i + 1) % 5 * 2] >>> 31);
                        for (let j = 0; j < 25; j += 5) {
                            s[(i + j) * 2] ^= t0;
                            s[(i + j) * 2 + 1] ^= t1;
                        }
                    }
                    let t0 = s[2], t1 = s[3];
                    for (let i = 0; i < 24; i++) {
                        let j = PI[i];
                        bc[0] = s[j * 2]; bc[1] = s[j * 2 + 1];
                        let r = RHO[i];
                        s[j * 2] = t0 << r | t1 >>> (32 - r);
                        s[j * 2 + 1] = t1 << r | t0 >>> (32 - r);
                        if (r >= 32) {
                            let tmp = s[j * 2];
                            s[j * 2] = s[j * 2 + 1];
                            s[j * 2 + 1] = tmp;
                        }
                        t0 = bc[0]; t1 = bc[1];
                    }
                    for (let j = 0; j < 25; j += 5) {
                        for (let i = 0; i < 5; i++) {
                            bc[i * 2] = s[(i + j) * 2]; bc[i * 2 + 1] = s[(i + j) * 2 + 1];
                        }
                        for (let i = 0; i < 5; i++) {
                            s[(i + j) * 2] ^= (~bc[(i + 1) % 5 * 2]) & bc[(i + 2) % 5 * 2];
                            s[(i + j) * 2 + 1] ^= (~bc[(i + 1) % 5 * 2 + 1]) & bc[(i + 2) % 5 * 2 + 1];
                        }
                    }
                    s[0] ^= RC[round * 2];
                    s[1] ^= RC[round * 2 + 1];
                }
            }
            return keccak;
        })();

        // Helpers
        const toHex = (buf) => Array.from(buf).map(b => b.toString(16).padStart(2, '0')).join('');
        const fromHex = (hex) => {
            hex = hex.replace(/^0x/i, '').replace(/[^0-9a-fA-F]/g, '');
            if (hex.length % 2 !== 0) hex = '0' + hex;
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
            return bytes;
        };

        const inputEl = document.getElementById('mainInput');
        const isHexEl = document.getElementById('isHex');

        function update() {
            let val = inputEl.value.trim();
            if (!val) {
                clearResults();
                return;
            }

            let bytes;
            if (isHexEl.checked) {
                bytes = fromHex(val);
            } else {
                bytes = new TextEncoder().encode(val);
            }

            const hashArray = Keccak256(bytes);
            const hashHex = toHex(hashArray);
            
            document.getElementById('resHash').textContent = '0x' + hashHex;
            document.getElementById('resSelector').textContent = '0x' + hashHex.substring(0, 8);
            
            // Padding
            let cleanHex = toHex(bytes);
            document.getElementById('resPadLeft').textContent = '0x' + cleanHex.padStart(64, '0').substring(0, 64);
            document.getElementById('resPadRight').textContent = '0x' + cleanHex.padEnd(64, '0').substring(0, 64);
            
            // Decimal
            try {
                if (cleanHex.length <= 16) {
                    document.getElementById('resDec').textContent = BigInt('0x' + (cleanHex || '0')).toString();
                } else {
                    document.getElementById('resDec').textContent = 'Large BigInt: ' + BigInt('0x' + cleanHex).toString();
                }
            } catch(e) {
                document.getElementById('resDec').textContent = '-';
            }

            // Length
            document.getElementById('resLen').innerHTML = `${bytes.length} bytes <span class="tag">${val.length} chars</span>`;

            // Checksum Address
            const addrMatch = val.replace(/^0x/, '').match(/^[0-9a-fA-F]{40}$/);
            if (addrMatch) {
                document.getElementById('resChecksum').textContent = toChecksumAddress(val);
            } else {
                document.getElementById('resChecksum').textContent = '-';
            }
        }

        function toChecksumAddress(address) {
            address = address.replace(/^0x/i, '').toLowerCase();
            const hash = toHex(Keccak256(new TextEncoder().encode(address)));
            let ret = '0x';
            for (let i = 0; i < address.length; i++) {
                if (parseInt(hash[i], 16) >= 8) ret += address[i].toUpperCase();
                else ret += address[i];
            }
            return ret;
        }

        function clearResults() {
            ['resHash', 'resSelector', 'resChecksum', 'resPadLeft', 'resPadRight', 'resDec', 'resLen'].forEach(id => {
                document.getElementById(id).textContent = '-';
            });
        }

        function copy(id) {
            const text = document.getElementById(id).textContent;
            if (text === '-' || !text) return;
            navigator.clipboard.writeText(text);
        }

        inputEl.addEventListener('input', update);
        isHexEl.addEventListener('change', update);

        // Initial placeholder logic
        inputEl.focus();
    </script>
</body>
</html>
