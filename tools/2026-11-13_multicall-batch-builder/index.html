  <title>Multicall3 Batch Builder & Visualizer</title>

    :root {
      --bg: #0b1211;
      --card: #111c1a;
      --card-hover: #162421;
      --accent: #14B8A6;
      --accent-hover: #0d9488;
      --accent-dim: rgba(20, 184, 166, 0.15);
      --border: #1e3531;
      --border-bright: #2dd4bf;
      --text: #f0fdfa;
      --text-dim: #99f6e4;
      --text-muted: #64748b;
      --danger: #f43f5e;
      --danger-dim: rgba(244, 63, 94, 0.15);
      --warning: #f59e0b;
      --code-bg: #070d0c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
