<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPFS CID Inspector & Converter</title>
<style>
  :root {
    --bg: #0b1211;
    --card: #111c1a;
    --card-border: #1a2b28;
    --accent: #14B8A6;
    --accent-hover: #0d9488;
    --accent-alpha: rgba(20, 184, 166, 0.15);
    --text: #e6edea;
    --text-muted: #839994;
    --danger: #f43f5e;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    line-height: 1.5;
    min-height: 100vh;
    padding: 1.5rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    background: var(--accent-alpha);
    padding: 0.2rem 0.6rem;
    border-radius: 9999px;
    width: fit-content;
    border: 1px solid rgba(20, 184, 166, 0.3);
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
  }

  p.subtitle {
    color: var(--text-muted);
    font-size: 0.925rem;
  }

  .card {
    background-color: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 0.75rem;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
  }

  .tabs {
    display: flex;
    gap: 0.5rem;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 0.75rem;
  }

  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 0.875rem;
    font-weight: 600;
    padding: 0.4rem 0.8rem;
    border-radius: 0.375rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .tab-btn:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.04);
  }

  .tab-btn.active {
    background: var(--accent-alpha);
    color: var(--accent);
    border: 1px solid rgba(20, 184, 166, 0.3);
  }

  .input-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  .presets {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .preset-link {
    font-size: 0.75rem;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    padding: 0;
  }

  .preset-link:hover {
    color: #fff;
  }

  .input-group {
    position: relative;
    display: flex;
  }

  input[type="text"], textarea {
    width: 100%;
    background-color: #0b1513;
    border: 1px solid var(--card-border);
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
    color: #fff;
    font-family: var(--font-mono);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-alpha);
  }

  .error-box {
    background: rgba(244, 63, 94, 0.1);
    border: 1px solid rgba(244, 63, 94, 0.3);
    color: var(--danger);
    font-size: 0.85rem;
    padding: 0.6rem 0.8rem;
    border-radius: 0.4rem;
    display: none;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
  }

  .breakdown-table {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .param-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0.5rem 0.65rem;
    background: #0d1715;
    border: 1px solid rgba(26, 43, 40, 0.6);
    border-radius: 0.4rem;
    font-size: 0.825rem;
  }

  .param-name {
    color: var(--text-muted);
    font-weight: 500;
  }

  .param-val {
    font-family: var(--font-mono);
    color: var(--text);
    font-weight: 600;
    text-align: right;
    word-break: break-all;
    max-width: 65%;
  }

  .tag {
    display: inline-block;
    padding: 0.1rem 0.4rem;
    border-radius: 0.25rem;
    background: rgba(20, 184, 166, 0.12);
    color: var(--accent);
    font-size: 0.75rem;
  }

  .output-box {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .output-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .copy-field {
    display: flex;
    background: #09100f;
    border: 1px solid var(--card-border);
    border-radius: 0.4rem;
    overflow: hidden;
  }

  .copy-val {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    padding: 0.55rem 0.75rem;
    color: #e0f2fe;
    overflow-x: auto;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .copy-btn {
    background: #142421;
    border: none;
    border-left: 1px solid var(--card-border);
    color: var(--text-muted);
    padding: 0 0.85rem;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }

  .copy-btn:hover {
    color: var(--accent);
    background: #182e2a;
  }

    display: flex
