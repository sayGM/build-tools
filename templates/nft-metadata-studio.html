<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Metadata Studio & On-Chain Generator</title>
  <style>
    :root {
      --bg-color: #0b1211;
      --card-bg: #111c1a;
      --card-border: #1d332f;
      --surface-bg: #172623;
      --surface-hover: #1f332f;
      --accent-teal: #14B8A6;
      --accent-hover: #0D9488;
      --accent-glow: rgba(20, 184, 166, 0.15);
      --text-main: #E2E8F0;
      --text-muted: #94A3B8;
      --text-dark: #64748B;
      --status-success: #10B981;
      --status-warning: #F59E0B;
      --status-danger: #EF4444;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding: 1.5rem;
      min-height: 100vh;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--accent-teal);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg-color);
      font-weight: bold;
      font-size: 1.25rem;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-title h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-title p {
      font-size: 0.825rem;
      color: var(--text-muted);
    }

    .preset-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-preset {
      background: var(--surface-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.775rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-preset:hover {
      background: var(--surface-hover);
      color: var(--accent-teal);
      border-color: var(--accent-teal);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Tabs */
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 1.5rem;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 2px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      color: var(--accent-teal);
      border-bottom-color: var(--accent-teal);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Grid Layouts */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
