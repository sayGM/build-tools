<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETH Selector Lab</title>
    <style>
        :root {
            --bg: #0b1211;
            --card: #111c1a;
            --accent: #14B8A6;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --border: #1e2e2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 1.5rem;
            line-height: 1.5;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-size: 1.5rem;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 0.875rem;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        input[type="text"] {
            width: 100%;
            background: #080d0c;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 0.75rem;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        button {
            background-color: #1e2e2b;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #2a3d3a;
        }

        button.active {
            background-color: var(--accent);
            color: #000;
            font-weight: 600;
            border-color: var(--accent);
        }

        .result-box {
            background: #080d0c;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            word-break: break-all;
            position: relative;
        }

        .result-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 0.25rem;
        }

        .result-value {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.7rem;
            background: var(--card);
        }

        .shortcuts {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .shortcut-chip {
            font-size: 0.7rem;
            background: #1e2e2b;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .shortcut-chip:hover {
            border-color: var(--accent);
        }

        footer {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.75rem;
            margin-top: 2rem;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ETH Selector Lab</h1>
        <p class="subtitle">Generate Solidity function selectors & event topics</p>
    </header>

    <div class="card">
        <label for="signature">Signature</label>
        <input type="text" id="signature" placeholder="transfer(address,uint256)" spellcheck="false" autocomplete="off">
        
        <div class="button-group">
            <button id="modeFunc" class="active" onclick="setMode('function')">Function (4-byte)</button>
            <button id="modeEvent" onclick="setMode('event')">Event (32-byte)</button>
        </div>

        <div class="shortcuts" id="shortcuts">
            <span class="shortcut-chip" onclick="fill('transfer(address,uint256)')">transfer</span>
            <span class="shortcut-chip" onclick="fill('approve(address,uint256)')">approve</span>
            <span class="shortcut-chip" onclick="fill('balanceOf(address)')">balanceOf</span>
            <span class="shortcut-chip" onclick="fill('Transfer(address,address,uint256)')">Transfer(event)</span>
            <span class="shortcut-chip" onclick="fill('Approval(address,address,uint256)')">Approval(event)</span>
        </div>
    </div>

    <div class="card" id="resultCard">
        <div class="result-box">
            <div class="result-label" id="typeLabel">Selector (Hex)</div>
            <div class="result-value" id="output">0x...</div>
            <button class="copy-btn" onclick="copyResult()">Copy</button>
        </div>
        <div id="fullHashContainer" class="result-box hidden">
            <div class="result-label">Full Keccak256 Hash</div>
            <div class="result-value" id="fullHash" style="font-size: 0.85rem;">0x...</div>
        </div>
    </div>

    <footer>
        Minimal Keccak-256 Implementation &bull; Client-side only
    </footer>
</div>

<script>
    /**
     * Compact Keccak-256 implementation
     */
    const Keccak256 = (function() {
        const rc = new Uint32Array([
            0x00000001, 0x00000000, 0x00008082, 0x00000000, 0x0000808a, 0x80000000, 0x80008000, 0x80000000,
            0x0000808b, 0x00000000, 0x80000001, 0x00000000, 0x80008081, 0x80000000, 0x00008009, 0x80000000,
            0x0000008a, 0x00000000, 0x00000088, 0x00000000, 0x80008009, 0x00000000, 0x8000000a, 0x00000000,
            0x8000808b, 0x00000000, 0x0000008b, 0x80000000, 0x00008089, 0x80000000, 0x00008003, 0x80000000,
            0x00008002, 0x80000000, 0x00000080, 0x80000000, 0x0000800a, 0x00000000, 0x8000000a, 0x80000000,
            0x80008081, 0x80000000, 0x00008080, 0x80000000, 0x80000001, 0x00000000, 0x80008008, 0x80000000
        ]);

        function keccak(message) {
            const msg = new Uint8Array(message);
            const state = new Uint32Array(50);
            const b = new Uint8Array(state.buffer);
            let ptr = 0;

            while (ptr < msg.length) {
                const len = Math.min(msg.length - ptr, 136);
                for (let i = 0; i < len; i++) b[i] ^= msg[ptr + i];
                if (len === 136) {
                    process(state);
                    ptr += 136;
                } else {
                    ptr += len;
                }
            }

            b[ptr % 136] ^= 0x01;
            b[135] ^= 0x80;
            process(state);

            const out = new Uint8Array(32);
            out.set(b.subarray(0, 32));
            return Array.from(out).map(x => x.toString(16).padStart(2, '0')).join('');
        }

        function process(s) {
            for (let r = 0; r < 24; r++) {
                let bc0 = s[0] ^ s[10] ^ s[20] ^ s[30] ^ s[40], bc1 = s[1] ^ s[11] ^ s[21] ^ s[31] ^ s[41];
                let bc2 = s[2] ^ s[12] ^ s[22] ^ s[32] ^ s[42], bc3 = s[3] ^ s[13] ^ s[23] ^ s[33] ^ s[43];
                let bc4 = s[4] ^ s[14] ^ s[24] ^ s[34] ^ s[44], bc5 = s[5] ^ s[15] ^ s[25] ^ s[35] ^ s[45];
                let bc6 = s[6] ^ s[16] ^ s[26] ^ s[36] ^ s[46], bc7 = s[7] ^ s[17] ^ s[27] ^ s[37] ^ s[47];
                let bc8 = s[8] ^ s[18] ^ s[28] ^ s[38] ^ s[48], bc9 = s[9] ^ s[19] ^ s[29] ^ s[39] ^ s[49];

                let t0 = bc8 ^ ((bc2 << 1) | (bc3 >>> 31)), t1 = bc9 ^ ((bc3 << 1) | (bc2 >>> 31));
                let t2 = bc0 ^ ((bc4 << 1) | (bc5 >>> 31)), t3 = bc1 ^ ((bc5 << 1) | (bc4 >>> 31));
                let t4 = bc2 ^ ((bc6 << 1) | (bc7 >>> 31)), t5 = bc3 ^ ((bc7 << 1) | (bc6 >>> 31));
                let t6 = bc4 ^ ((bc8 << 1) | (bc9 >>> 31)), t7 = bc5 ^ ((bc9 << 1) | (bc8 >>> 31));
                let t8 = bc6 ^ ((bc0 << 1) | (bc1 >>> 31)), t9 = bc7 ^ ((bc1 << 1) | (bc0 >>> 31));

                for (let i = 0; i < 50; i += 10) {
                    s[i] ^= t0; s[i + 1] ^= t1; s[i + 2] ^= t2; s[i + 3] ^= t3; s[i + 4] ^= t4;
                    s[i + 5] ^= t5; s[i + 6] ^= t6; s[i + 7] ^= t7; s[i + 8] ^= t8; s[i + 9] ^= t9;
                }

                let cur0 = s[0], cur1 = s[1];
                let next0, next1;
                // Rho & Pi
                let rIdx = [0, 1, 62, 28, 27, 36, 44, 6, 55, 20, 3, 10, 43, 25, 39, 41, 45, 15, 21, 8, 18, 2, 61, 56, 14];
                let pIdx = [0, 10, 20, 30, 40, 2, 12, 22, 32, 42, 4, 14, 24, 34, 44, 6, 16, 26, 36, 46, 8, 18, 28, 38, 48];
                
                for(let i=0; i<24; i++) {
                    let dest = pIdx[i+1];
                    let rot = rIdx[i+1];
                    next0 = s[dest]; next1 = s[dest+1];
                    let r32 = rot % 32;
                    if (rot < 32) {
                        s[dest] = (cur0 << rot) | (cur1 >>> (32-rot));
                        s[dest+1] = (cur1 << rot) | (cur0 >>> (32-rot));
                    } else {
                        s[dest] = (cur1 << r32) | (cur0 >>> (32-r32));
                        s[dest+1] = (cur0 << r32) | (cur1 >>> (32-r32));
                    }
                    cur0 = next0; cur1 = next1;
                }

                // Chi
                for (let j = 0; j < 50; j += 10) {
                    let a0 = s[j], a1 = s[j+1], a2 = s[j+2], a3 = s[j+3], a4 = s[j+4], a5 = s[j+5], a6 = s[j+6], a7 = s[j+7], a8 = s[j+8], a9 = s[j+9];
                    s[j] ^= ~a2 & a4; s[j+1] ^= ~a3 & a5;
                    s[j+2] ^= ~a4 & a6; s[j+3] ^= ~a5 & a7;
                    s[j+4] ^= ~a6 & a8; s[j+5] ^= ~a7 & a9;
                    s[j+6] ^= ~a8 & a0; s[j+7] ^= ~a9 & a1;
                    s[j+8] ^= ~a0 & a2; s[j+9] ^= ~a1 & a3;
                }

                // Iota
                s[0] ^= rc[r * 2];
                s[1] ^= rc[r * 2 + 1];
            }
        }

        return (str) => keccak(new TextEncoder().encode(str));
    })();

    let currentMode = 'function';
    const input = document.getElementById('signature');
    const output = document.getElementById('output');
    const fullHash = document.getElementById('fullHash');
    const typeLabel = document.getElementById('typeLabel');
    const fullHashContainer = document.getElementById('fullHashContainer');

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeFunc').classList.toggle('active', mode === 'function');
        document.getElementById('modeEvent').classList.toggle('active', mode === 'event');
        typeLabel.textContent = mode === 'function' ? 'Selector (4-byte)' : 'Topic (32-byte)';
        fullHashContainer.classList.toggle('hidden', mode === 'event');
        calculate();
    }

    function fill(val) {
        input.value = val;
        // Auto detect event if it starts with caps or is in known list
        if (val.includes('Transfer') || val.includes('Approval')) {
            setMode('event');
        } else {
            setMode('function');
        }
        calculate();
    }

    function calculate() {
        const raw = input.value.trim();
        if (!raw) {
            output.textContent = '0x...';
            fullHash.textContent = '0x...';
            return;
        }

        // Normalize signature: remove spaces, keep only name and types
        // e.g. "transfer ( address, uint256 )" -> "transfer(address,uint256)"
        const normalized = raw.replace(/\s+/g, '');
        
        try {
            const hash = Keccak256(normalized);
            if (currentMode === 'function') {
                output.textContent = '0x' + hash.substring(0, 8);
                fullHash.textContent = '0x' + hash;
            } else {
                output.textContent = '0x' + hash;
            }
        } catch (e) {
            output.textContent = 'Invalid input';
        }
    }

    function copyResult() {
        const val = output.textContent;
        if (val === '0x...' || val === 'Invalid input') return;
        navigator.clipboard.writeText(val);
        
        const btn = document.querySelector('.copy-btn');
        const oldText = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = oldText, 1000);
    }

    input.addEventListener('input', calculate);

    // Init
    calculate();
</script>

</body>
</html>
