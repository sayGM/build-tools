<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EIP-712 Typed Data Inspector</title>
  <style>
    :root {
      --bg: #0b1211;
      --card: #111c1a;
      --card-hover: #162422;
      --border: #1b2f2b;
      --border-focus: #14B8A6;
      --accent: #14B8A6;
      --accent-dim: rgba(20, 184, 166, 0.15);
      --accent-glow: rgba(20, 184, 166, 0.3);
      --text: #e6f1ef;
      --text-muted: #839d98;
      --text-sub: #54706a;
      --code-bg: #070d0c;
      --danger: #f87171;
      --warn: #fbbf24;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .icon-badge {
      width: 2.25rem;
      height: 2.25rem;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: 700;
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .presets-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .bar-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.75rem;
      font-size: 0.78rem;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-accent {
      background: var(--accent);
      color: #042522;
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-accent:hover {
      background: #2dd4bf;
      color: #021a17;
      border-color: #2dd4bf;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 960px) {
      .main-grid {
        grid-template-columns: 1.1fr 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(20, 184, 166, 0.3);
      font-family: var(--font-mono);
    }

    .json-editor-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
    }

    textarea.editor {
      width: 100%;
      height: 480px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #c9ded9;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      line-height: 1.45;
      padding: 0.75rem;
      resize: vertical;
      outline: none;
      tab-size: 2;
      transition: border-color 0.2s;
    }

    textarea.editor:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .error-banner {
      display: none;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-family: var(--font-mono);
      word-break: break-all;
    }

    .digest-banner {
      background: linear-gradient(135deg, rgba(20, 184, 166, 0.12), rgba(11, 18, 17, 0.8));
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .digest-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .digest-value {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: #fff;
      word-break: break-all;
      font-weight: 600;
      background: var(--code-bg);
      padding: 0.6rem 0.75rem;
      border-radius: 6px
