<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVM Storage Gas Lab (SSTORE & Refund Simulator)</title>
  <style>
    :root {
      --bg: #0b1211;
      --card: #111c1a;
      --card-border: #1a2e2a;
      --card-hover: #152522;
      --accent: #14b8a6;
      --accent-hover: #2dd4bf;
      --accent-dim: rgba(20, 184, 166, 0.15);
      --text: #e6f1ef;
      --text-muted: #829c97;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1060px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tagline {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .fork-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 4px;
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--accent);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-bottom: 2px solid var(--accent);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .preset-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: #152220;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-btn:hover {
      background: var(--card-hover);
      color: var(--accent);
      border-color: var(--accent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    @media (max-width: 768px) {
      .grid-2, .grid-3, .grid-4 {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="text"], input[type="number"] {
      background: #09100e;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .toggle-group {
      display: flex;
      gap: 6px;
      background: #09100e;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    .toggle-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      text-align: center;
    }

    .toggle-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 600;
    }

    .metric-card {
      background: #0d1715;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .metric-val {
      font-family: var(--font-mono);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .metric-val.teal { color: var(--accent); }
    .metric-val.green { color: var(--success); }
    .metric-val.red { color: var(--danger); }
    .metric-val.warn { color: var(--warning); }

    .metric-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .flow-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .flow-step {
      background: #0d1715;
      border-left: 3px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .flow-step.hit {
      border-left-color: var(--accent);
      background: #11201d;
    }

    .flow-step.refund {
      border-left-color: var(--success);
    }

    .flow-step.penalty {
      border-left-color: var(--danger);
    }

    .code-pill {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0
