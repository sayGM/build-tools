<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevData Forge | String & Data Transformer</title>
    <style>
        :root {
            --bg: #0b1211;
            --card: #111c1a;
            --accent: #14B8A6;
            --accent-hover: #0d9488;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --border: #1e2f2b;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.5;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-size: 1.8rem;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 1.5rem;
        }

        .io-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
        }

        textarea {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 120px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        button {
            background: var(--border);
            color: var(--text);
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        button:hover {
            background: var(--accent);
            color: var(--bg);
            font-weight: bold;
        }

        button.active {
            background: var(--accent);
            color: var(--bg);
        }

        .btn-copy {
            font-size: 0.7rem;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 2px 8px;
            height: fit-content;
        }

        .btn-copy:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .error-msg {
            color: var(--error);
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .controls {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DevData Forge</h1>
        <p class="subtitle">Multi-purpose data transformation utility for developers</p>
    </header>

    <div class="card">
        <div class="io-group">
            <label>Input 
                <span id="input-stats" class="stats">Chars: 0 | Lines: 0</span>
            </label>
            <textarea id="input" placeholder="Paste data here... (Text, Hex, Base64, JSON, etc.)"></textarea>
        </div>

        <div class="controls">
            <button onclick="transform('toBase64')">Base64 Enc</button>
            <button onclick="transform('fromBase64')">Base64 Dec</button>
            <button onclick="transform('toHex')">Hex Enc</button>
            <button onclick="transform('fromHex')">Hex Dec</button>
            <button onclick="transform('urlEnc')">URL Enc</button>
            <button onclick="transform('urlDec')">URL Dec</button>
            <button onclick="transform('jsonFormat')">JSON Pretty</button>
            <button onclick="transform('jsonMin')">JSON Minify</button>
            <button onclick="transform('jwtDec')">JWT Decode</button>
            <button onclick="transform('toSlug')">To-Slug</button>
            <button onclick="transform('toSnake')">snake_case</button>
            <button onclick="transform('toCamel')">camelCase</button>
        </div>

        <div class="io-group">
            <label>Output 
                <button class="btn-copy" onclick="copyOutput()">Copy Output</button>
            </label>
            <textarea id="output" readonly placeholder="Result will appear here..."></textarea>
            <div id="error" class="error-msg"></div>
        </div>
    </div>
</div>

<script>
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const errorEl = document.getElementById('error');
    const inputStats = document.getElementById('input-stats');

    inputEl.addEventListener('input', updateStats);

    function updateStats() {
        const val = inputEl.value;
        const lines = val ? val.split('\n').length : 0;
        inputStats.innerText = `Chars: ${val.length} | Lines: ${lines}`;
    }

    function showError(msg) {
        errorEl.innerText = msg;
        errorEl.style.display = msg ? 'block' : 'none';
        if(msg) setTimeout(() => showError(''), 4000);
    }

    async function copyOutput() {
        if (!outputEl.value) return;
        try {
            await navigator.clipboard.writeText(outputEl.value);
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.innerText;
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = originalText, 2000);
        } catch (err) {
            showError('Failed to copy');
        }
    }

    const transformers = {
        toBase64: (str) => btoa(unescape(encodeURIComponent(str))),
        fromBase64: (str) => decodeURIComponent(escape(atob(str))),
        toHex: (str) => {
            return Array.from(new TextEncoder().encode(str))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        },
        fromHex: (str) => {
            const hex = str.replace(/\s+|0x/g, '');
            const bytes = new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            return new TextDecoder().decode(bytes);
        },
        urlEnc: (str) => encodeURIComponent(str),
        urlDec: (str) => decodeURIComponent(str),
        jsonFormat: (str) => JSON.stringify(JSON.parse(str), null, 4),
        jsonMin: (str) => JSON.stringify(JSON.parse(str)),
        jwtDec: (str) => {
            const parts = str.split('.');
            if (parts.length !== 3) throw new Error('Invalid JWT format');
            const header = JSON.parse(atob(parts[0].replace(/-/g, '+').replace(/_/g, '/')));
            const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
            return JSON.stringify({ header, payload }, null, 4);
        },
        toSlug: (str) => str.toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-').replace(/^-+|-+$/g, ''),
        toSnake: (str) => str.match(/[A-Z]{2,}(?=[A-Z][a-z]+[0-9]*|\b)|[A-Z]?[a-z]+[0-9]*|[A-Z]|[0-9]+/g).map(x => x.toLowerCase()).join('_'),
        toCamel: (str) => {
            const s = str.match(/[A-Z]{2,}(?=[A-Z][a-z]+[0-9]*|\b)|[A-Z]?[a-z]+[0-9]*|[A-Z]|[0-9]+/g).map(x => x.toLowerCase());
            return s[0] + s.slice(1).map(x => x.charAt(0).toUpperCase() + x.slice(1)).join('');
        }
    };

    function transform(type) {
        showError('');
        const val = inputEl.value.trim();
        if (!val) return;

        try {
            const result = transformers[type](val);
            outputEl.value = result;
        } catch (e) {
            showError(`Error: ${e.message}`);
            outputEl.value = '';
        }
    }
</script>

</body>
</html>
