<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVM Bytecode Diff Inspector</title>
    <style>
        :root {
            --bg: #0b1211;
            --card: #111c1a;
            --accent: #14B8A6;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --err: #ef4444;
            --diff: #f97316;
            --match: #14B8A6;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin: 0;
        }

        .card {
            background-color: var(--card);
            border: 1px solid #1f2f2c;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: bold;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #070b0a;
            border: 1px solid #1f2f2c;
            border-radius: 4px;
            color: var(--text);
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background-color: var(--accent);
            color: var(--bg);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            flex: 1;
        }

        button:hover {
            opacity: 0.9;
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .diff-viewer {
            overflow-x: auto;
            background: #070b0a;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre;
            font-size: 0.8rem;
            line-height: 1.5;
        }

        .diff-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1f2f2c;
        }

        .stat-item {
            font-size: 0.8rem;
        }

        .stat-value {
            color: var(--accent);
            font-weight: bold;
        }

        .byte {
            display: inline-block;
            width: 2ch;
            text-align: center;
        }

        .byte.mismatch {
            background-color: rgba(249, 115, 22, 0.2);
            color: var(--diff);
            font-weight: bold;
            border-radius: 2px;
        }

        .byte.meta {
            color: #8b5cf6;
            text-decoration: underline;
        }

        .hex-row {
            display: flex;
            gap: 10px;
            margin-bottom: 2px;
        }

        .offset {
            color: var(--text-dim);
            user-select: none;
            width: 6ch;
            flex-shrink: 0;
        }

        .bytes-group {
            display: flex;
            gap: 8px;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>EVM Bytecode Diff Inspector</h1>
        <p>Compare compiled bytecode and isolate metadata hash discrepancies</p>
    </header>

    <div class="card">
        <div class="grid">
            <div>
                <label>Bytecode A (Reference)</label>
                <textarea id="inputA" placeholder="0x60806040..."></textarea>
            </div>
            <div>
                <label>Bytecode B (Comparison)</label>
                <textarea id="inputB" placeholder="0x60806040..."></textarea>
            </div>
        </div>
        <div class="controls">
            <button onclick="compareBytecode()">Analyze Differences</button>
            <button class="secondary" onclick="clearAll()">Clear</button>
        </div>
    </div>

    <div id="resultsCard" class="card hidden">
        <div class="diff-header">
            <div class="stat-item">Size A: <span id="sizeA" class="stat-value">0</span> bytes</div>
            <div class="stat-item">Size B: <span id="sizeB" class="stat-value">0</span> bytes</div>
            <div class="stat-item">Similarity: <span id="simScore" class="stat-value">0%</span></div>
        </div>

        <div id="diffOutput" class="diff-viewer"></div>

        <div class="legend">
            <div class="legend-item">
                <div class="dot" style="background: var(--text);"></div> Normal
            </div>
            <div class="legend-item">
                <div class="dot" style="background: var(--diff);"></div> Mismatch
            </div>
            <div class="legend-item">
                <div class="dot" style="background: #8b5cf6;"></div> Potential Metadata
            </div>
        </div>
    </div>
</div>

<script>
    function normalize(hex) {
        return hex.trim().replace(/^0x/i, '').replace(/[^0-9a-fA-F]/g, '');
    }

    // Attempt to find the Solidity metadata start
    // Standard Solidity footer: 0xa2 0x64 'i' 'p' 'f' 's' (64 69 70 66 73) or similar
    function findMetadataIndex(hex) {
        const patterns = ['a26469706673', 'a165627a7a7230', 'a265627a7a7231'];
        for (let p of patterns) {
            const idx = hex.lastIndexOf(p);
            if (idx !== -1 && idx > hex.length * 0.7) return idx;
        }
        return -1;
    }

    function compareBytecode() {
        const rawA = document.getElementById('inputA').value;
        const rawB = document.getElementById('inputB').value;

        const hexA = normalize(rawA);
        const hexB = normalize(rawB);

        if (!hexA && !hexB) return;

        const sizeA = hexA.length / 2;
        const sizeB = hexB.length / 2;
        
        document.getElementById('sizeA').textContent = sizeA;
        document.getElementById('sizeB').textContent = sizeB;

        const maxLen = Math.max(hexA.length, hexB.length);
        const metaA = findMetadataIndex(hexA);
        const metaB = findMetadataIndex(hexB);

        let html = '';
        let matches = 0;
        let totalBytes = Math.ceil(maxLen / 2);

        for (let i = 0; i < maxLen; i += 32) {
            let row = `<div class="hex-row">`;
            row += `<span class="offset">${(i / 2).toString(16).padStart(4, '0')}</span>`;
            
            row += `<div class="bytes-group">`;
            for (let j = 0; j < 32; j += 2) {
                const idx = i + j;
                if (idx >= maxLen) break;

                const byteA = hexA.substr(idx, 2) || '--';
                const byteB = hexB.substr(idx, 2) || '--';
                
                let className = 'byte';
                const isMismatch = byteA !== byteB;
                const isMeta = (metaA !== -1 && idx >= metaA) || (metaB !== -1 && idx >= metaB);

                if (isMismatch) className += ' mismatch';
                if (isMeta) className += ' meta';
                if (!isMismatch && byteA !== '--') matches++;

                row += `<span class="${className}" title="A: ${byteA}\nB: ${byteB}">${byteB === '--' ? byteA : byteB}</span>`;
            }
            row += `</div></div>`;
            html += row;
        }

        const score = totalBytes > 0 ? Math.round((matches / totalBytes) * 100) : 0;
        document.getElementById('simScore').textContent = score + '%';
        document.getElementById('diffOutput').innerHTML = html;
        document.getElementById('resultsCard').classList.remove('hidden');
    }

    function clearAll() {
        document.getElementById('inputA').value = '';
        document.getElementById('inputB').value = '';
        document.getElementById('resultsCard').classList.add('hidden');
    }

    // Auto-process if both are pasted
    document.querySelectorAll('textarea').forEach(el => {
        el.addEventListener('input', () => {
            const a = document.getElementById('inputA').value;
            const b = document.getElementById('inputB').value;
            if (a.length > 20 && b.length > 20) compareBytecode();
        });
    });
</script>

</body>
</html>
