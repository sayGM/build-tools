<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIP-681 Transaction Linker</title>
    <style>
        :root {
            --bg: #0b1211;
            --card: #111c1a;
            --accent: #14B8A6;
            --text: #e5e7eb;
            --text-dim: #9ca3af;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 1rem;
        }

        h1 {
            color: var(--accent);
            font-size: 1.5rem;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .card {
            background-color: var(--card);
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 0.4rem;
        }

        input, select, textarea {
            width: 100%;
            background: #070d0c;
            border: 1px solid #2d3748;
            border-radius: 6px;
            padding: 0.6rem;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .result-box {
            background: #070d0c;
            border-radius: 8px;
            padding: 1rem;
            word-break: break-all;
            font-family: monospace;
            border-left: 4px solid var(--accent);
            margin-bottom: 1rem;
            min-height: 3rem;
            display: flex;
            align-items: center;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: #1f2937;
            color: var(--text);
            margin-top: 0.5rem;
        }

        .param-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .param-row input {
            flex: 1;
        }

        .remove-btn {
            background: none;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 0 0.5rem;
            cursor: pointer;
            border-radius: 4px;
        }

        .footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 2rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #2d3748;
        }

        .tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .tab.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>EIP-681 Linker</h1>
        <p class="subtitle">Standard Ethereum transaction URI generator</p>
    </header>

    <div class="card">
        <div class="tabs">
            <div id="tab-pay" class="tab active" onclick="setMode('pay')">Payment</div>
            <div id="tab-call" class="tab" onclick="setMode('call')">Contract Call</div>
        </div>

        <div class="input-group">
            <label>Target Address (0x...)</label>
            <input type="text" id="target" placeholder="0x0000000000000000000000000000000000000000" oninput="update()">
        </div>

        <div class="grid">
            <div class="input-group">
                <label>Chain ID (optional)</label>
                <input type="number" id="chainId" placeholder="1" oninput="update()">
            </div>
            <div id="value-group" class="input-group">
                <label>Value (ETH)</label>
                <input type="number" id="value" step="any" placeholder="0.0" oninput="update()">
            </div>
        </div>

        <div id="call-fields" class="hidden">
            <div class="input-group">
                <label>Function Name</label>
                <input type="text" id="functionName" placeholder="transfer" oninput="update()">
            </div>
            <div class="input-group">
                <label>Arguments (type=value)</label>
                <div id="params-container"></div>
                <button class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.3rem;" onclick="addParam()">+ Add Argument</button>
            </div>
        </div>

        <div class="grid">
            <div class="input-group">
                <label>Gas Limit (optional)</label>
                <input type="number" id="gas" placeholder="21000" oninput="update()">
            </div>
            <div class="input-group">
                <label>Gas Price Gwei (optional)</label>
                <input type="number" id="gasPrice" placeholder="20" oninput="update()">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Resulting URI</div>
        <div class="result-box" id="result-uri">ethereum:</div>
        <button class="btn" onclick="copyResult()">Copy URI</button>
    </div>

    <div class="footer">
        Based on EIP-681 Standard • No data leaves your browser.
    </div>
</div>

<script>
    let mode = 'pay';
    const params = [];

    function setMode(m) {
        mode = m;
        document.getElementById('tab-pay').classList.toggle('active', m === 'pay');
        document.getElementById('tab-call').classList.toggle('active', m === 'call');
        document.getElementById('call-fields').classList.toggle('hidden', m === 'pay');
        document.getElementById('value-group').classList.toggle('hidden', m === 'call');
        update();
    }

    function addParam() {
        const id = Date.now();
        params.push({ id, type: 'address', value: '' });
        renderParams();
    }

    function removeParam(id) {
        const index = params.findIndex(p => p.id === id);
        if (index > -1) {
            params.splice(index, 1);
            renderParams();
            update();
        }
    }

    function updateParam(id, field, value) {
        const param = params.find(p => p.id === id);
        if (param) {
            param[field] = value;
            update();
        }
    }

    function renderParams() {
        const container = document.getElementById('params-container');
        container.innerHTML = '';
        params.forEach(p => {
            const div = document.createElement('div');
            div.className = 'param-row';
            div.innerHTML = `
                <input type="text" placeholder="type (e.g. uint256)" value="${p.type}" oninput="updateParam(${p.id}, 'type', this.value)">
                <input type="text" placeholder="value" value="${p.value}" oninput="updateParam(${p.id}, 'value', this.value)">
                <button class="remove-btn" onclick="removeParam(${p.id})">×</button>
            `;
            container.appendChild(div);
        });
    }

    function update() {
        const target = document.getElementById('target').value.trim();
        const chainId = document.getElementById('chainId').value;
        const value = document.getElementById('value').value;
        const gas = document.getElementById('gas').value;
        const gasPrice = document.getElementById('gasPrice').value;
        const func = document.getElementById('functionName').value.trim();

        if (!target) {
            document.getElementById('result-uri').innerText = 'ethereum:';
            return;
        }

        let uri = 'ethereum:';
        
        // Mode prefix
        if (mode === 'pay') {
            uri += `pay-${target}`;
        } else {
            uri += target;
        }

        // Chain ID
        if (chainId) {
            uri += `@${chainId}`;
        }

        // Function and Params
        let queryParams = [];

        if (mode === 'call' && func) {
            uri += `/${func}`;
            params.forEach(p => {
                if (p.type && p.value) {
                    queryParams.push(`${encodeURIComponent(p.type)}=${encodeURIComponent(p.value)}`);
                }
            });
        }

        // Global params
        if (mode === 'pay' && value) {
            // EIP-681 usually expects values in wei or scientific notation
            // We convert ETH input to scientific notation if it's small, otherwise direct string
            const wei = parseFloat(value) * 1e18;
            if (!isNaN(wei)) {
                queryParams.push(`value=${wei.toExponential().replace('+', '')}`);
            }
        }

        if (gas) queryParams.push(`gas=${gas}`);
        if (gasPrice) {
            const gpWei = parseFloat(gasPrice) * 1e9;
            queryParams.push(`gasPrice=${gpWei.toExponential().replace('+', '')}`);
        }

        if (queryParams.length > 0) {
            uri += '?' + queryParams.join('&');
        }

        document.getElementById('result-uri').innerText = uri;
    }

    function copyResult() {
        const text = document.getElementById('result-uri').innerText;
        if (text === 'ethereum:') return;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.btn');
            const original = btn.innerText;
            btn.innerText = 'Copied!';
            btn.style.background = '#ffffff';
            setTimeout(() => {
                btn.innerText = original;
                btn.style.background = 'var(--accent)';
            }, 1500);
        });
    }

    // Init
    update();
</script>

</body>
</html>
