<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIP-2535 Diamond Cut Lab</title>
<style>
  :root {
    --bg: #0b1211;
    --card: #111c1a;
    --card-header: #152421;
    --card-border: #1a2f2b;
    --accent: #14B8A6;
    --accent-glow: rgba(20, 184, 166, 0.2);
    --accent-dim: #0f766e;
    --text: #e2e8f0;
    --text-muted: #8e9e9a;
    --add-color: #10B981;
    --replace-color: #F59E0B;
    --remove-color: #EF4444;
    --code-bg: #070d0c;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, monospace;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1.25rem;
    font-size: 14px;
    line-height: 1.5;
  }

  .container {
    max-width: 1040px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 1.5rem;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .badge {
    background: var(--accent-glow);
    color: var(--accent);
    border: 1px solid var(--accent);
    font-size: 0.75rem;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  p.subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 0.25rem;
  }

  .nav-pills {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 0.75rem;
  }

  .pill-btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text-muted);
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: all 0.2s;
  }

  .pill-btn:hover {
    color: #fff;
    border-color: var(--accent);
  }

  .pill-btn.active {
    background: var(--accent);
    color: #04221e;
    border-color: var(--accent);
  }

  .presets-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
    align-items: center;
  }

  .preset-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .btn-sm {
    background: #142421;
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 0.3rem 0.65rem;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-sm:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.25rem;
  }

  @media (min-width: 960px) {
    .grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  .card {
    background-color: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
  }

  .card-header {
    background: var(--card-header);
    border-bottom: 1px solid var(--card-border);
    padding: 0.75rem 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-header h2 {
    font-size: 0.95rem;
    font-weight: 600;
    color: #fff;
  }

  .card-body {
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .facet-card {
    background: #0d1715;
    border: 1px solid #1a2c28;
    border-radius: 6px;
    padding: 0.85rem;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .facet-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .facet-index {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
  }

  .action-toggles {
    display: inline-flex;
    background: #070d0c;
    border-radius: 4px;
    border: 1px solid var(--card-border);
    overflow: hidden;
  }

  .action-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.25rem 0.55rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  .action-btn.active[data-action="0"] { background: var(--add-color); color: #042214; }
  .action-btn.active[data-action="1"] { background: var(--replace-color); color: #2e1700; }
  .action-btn.active[data-action="2"] { background: var(--remove-color); color: #fff; }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  input[type="text"], textarea {
    background: var(--code-bg);
    border: 1px solid var(--card-border);
    color: #fff;
    padding: 0.5rem 0.65rem;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.8rem;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
  }

  textarea {
    resize: vertical;
    min-height: 60px;
    line-height: 1.4;
  }

  .selectors-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 0.25rem;
  }

  .selector-tag {
    background: #142824;
    border: 1px solid #1e3a34;
    color: var(--accent);
    font-family: monospace;
    font-size: 0.7rem;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .selector-tag.invalid {
    border-color: var(--remove-color);
    color: var(--remove-color);
  }

  .selector-tag.collision {
    border-color: var(--replace-color);
    color: var(--replace-color);
  }

  .btn-remove-facet {
    background: transparent;
    border: none;
    color: #64748b;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    padding: 0.2rem;
  }

  .btn-remove-facet:hover {
    color: var(--remove-color);
  }

  .btn-add-facet {
    background: #0d1e1b;
    border: 1px dashed var(--accent);
    color: var(--accent);
    padding: 0.65rem;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
  }

  .btn-add-facet:hover {
    background: #132b27;
  }

  .output-tabs {
    display: flex;
    gap: 0.25rem;
    border-bottom: 1px solid var(--card-border);
    margin-bottom: 0.5rem;
  }

  .out-tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    padding: 0.4rem 0.75rem;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
  }

  .out-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .code-container {
    position: relative;
  }

  pre {
    background: var(--code-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 0.75rem;
    overflow-x: auto;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.75rem;
    color: #cbd5e1;
    max-height: 380px;
    line-height: 1.45;
  }

  .btn-copy {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    background: #162a26;
    border: 1px solid var(--card-border);
    color: var(--accent);
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    font-size: 0.7rem;
    cursor: pointer;
    font-weight: 600;
  }

  .btn-copy:hover {
    background: var(--accent);
    color: #04221e;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
  }

  .stat-card {
    background: #091210;
    border: 1px solid var(--card-border);
    border-radius: 5px;
    padding: 0.5rem;
    text-align: center;
  }

  .stat-val {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    font-family: monospace;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .alert {
    padding: 0.5rem 0.75rem;
    border-radius: 4px;
    font-size: 0.75rem;
